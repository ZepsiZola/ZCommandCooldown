name: ZCommandCooldown
authors: [Zepsi_Zola_]
version: 1.0-SNAPSHOT
api-version: "1.20"
main: me.zepsizola.zcommandcooldown.ZCommandCooldown
description: A command cooldown plugin with permission-based cooldowns
folia-supported: true

commands:
  zcommandcooldown:
    description: Main command for ZCommandCooldown
    aliases:
      - zcc
    permission: zcommandcooldown.admin
    usage: "/zcc [reload|clear <player>|debug|help]"

permissions:
  zcommandcooldown.admin:
    description: Allows access to admin commands
    default: op
  zcommandcooldown.bypass:
    description: Allows bypassing all command cooldowns
    default: op
  zcommandcooldown.clear:
    description: Allows clearing cooldowns for players
    default: op
  zcommandcooldown.reload:
    description: Allows reloading the plugin configuration
    default: op

